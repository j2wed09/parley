<!doctype html>
<!-- lang matches the app's default locale, not this file's language: main.tsx
     overwrites it from the saved setting on boot, and this is the value the
     first paint uses. A zh-TW choice switches it to zh-Hant-TW (the Hant
     subtag is what steers Han fallback — see main.tsx and --font-sans). -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/parley.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parley</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
